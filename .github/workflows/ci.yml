name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  moonbit:
    name: MoonBit check & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: MoonBit version
        run: moon version --all

      - name: moon check
        run: |
          moon fmt --check
          moon check --deny-warn
          moon info
          git diff --exit-code
          git status

      - name: moon test
        run: |
          for target in wasm-gc wasm js native; do
            echo "== testing $target"
            moon test --target "$target" --deny-warn
          done

      - name: moon test coverage
        run: |
          moon test --deny-warn --enable-coverage
          moon coverage report -f summary

          moon coverage analyze

      - name: moon build
        run: |
          for target in wasm-gc wasm js native; do
            echo "== building $target"
            moon build --target "$target"
            moon build --target "$target" --release
          done

      - name: moon run cmd
        run: |
          moon run cmd/sm2
          moon run cmd/sm3
          moon run cmd/sm4

      - name: Tokei
        run: docker run --rm -v $(pwd):/src ghcr.io/xampprocky/tokei:latest .